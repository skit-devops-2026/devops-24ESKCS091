groups:
  - name: spendly-alerts
    rules:
      - alert: SpendlyWebDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spendly web target is down"
          description: "The nginx exporter reports the Spendly web service as down for more than 1 minute."
      - alert: SpendlyHighConnectionRate
        expr: rate(nginx_connections_accepted[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusually high connection rate on Spendly web"
          description: "Accepted connections exceeded 10 per second for 5 minutes."
